<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vendor Sign In — FROSE Street Micro-POS</title>
  <link rel="stylesheet" href="/css/style.css?v=2.3.0">
  <link rel="stylesheet" href="/css/tokens.css?v=1.0.0">
  <link rel="stylesheet" href="/css/ui-kit.css?v=1.0.0">
  <link rel="stylesheet" href="/css/portals-saas.css?v=1.0.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F6F7F9">
  <script src="/js/theme.js?v=1.0.0"></script>
  <script src="/js/api-client.js?v=1.0.0"></script>
  <script src="/js/safe-dom.js?v=1.0.0"></script>
  <script src="/js/idb-store.js?v=1.0.0"></script>
  <script src="/js/ui-components.js?v=1.0.0"></script>
  <script src="/js/pwa-updater.js?v=1.0.0"></script>
  <style>
    @media (max-width: 480px) {
      .login-container {
        margin: 16px auto !important;
        padding: 22px 18px !important;
        width: calc(100% - 24px) !important;
        border-radius: 16px !important;
      }
      .login-header { margin-bottom: 20px !important; }
      .login-logo { width: 48px !important; height: 48px !important; font-size: 22px !important; margin-bottom: 8px !important; }
    }
    .login-container {
      max-width: 440px;
      margin: 40px auto;
      padding: 28px 24px;
      background: var(--bg-surface, #FFFFFF);
      border-radius: var(--radius-xl, 20px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-light, #E2E8F0);
    }
    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0284C7 0%, #0369A1 100%);
      color: #FFF;
      font-weight: 800;
      font-size: 24px;
      margin-bottom: 12px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1.5px solid var(--border-default);
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
      transition: border-color 0.2s ease;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .form-input:disabled {
      background: var(--bg-subtle);
      color: var(--text-muted);
      cursor: not-allowed;
    }
    .password-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .password-input-wrapper .form-input {
      padding-right: 46px;
    }
    .btn-toggle-eye {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      min-width: 44px;
      min-height: 44px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color 0.2s ease;
    }
    .btn-toggle-eye:hover {
      color: var(--text-primary);
    }
    .btn-submit-login {
      width: 100%;
      height: 50px;
      background: var(--accent-primary);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s ease, background 0.2s ease;
    }
    .btn-submit-login:hover {
      background: #0369A1;
    }
    .btn-submit-login:disabled {
      background: #94A3B8;
      cursor: not-allowed;
      opacity: 0.7;
    }
    .login-footer-links {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-muted);
    }
    .login-footer-links a {
      color: var(--text-muted);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .login-footer-links a:hover {
      color: var(--accent-primary);
    }
    .alert-banner {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 13.5px;
      line-height: 1.4;
      display: none;
    }
    .alert-banner.error {
      background: #FEF2F2;
      color: #991B1B;
      border: 1px solid #F87171;
      display: block;
    }
    .alert-banner.success {
      background: #F0FDF4;
      color: #166534;
      border: 1px solid #86EFAC;
      display: block;
    }
  </style>
</head>
<body class="auth-saas-body">
  <div class="login-container">
    <div style="display: flex; justify-content: flex-end; margin-bottom: 6px;">
      <button type="button" id="btn-login-theme" class="saas-icon-btn" style="min-width: 44px; min-height: 44px;" aria-label="Switch Theme" title="Switch Theme">
        <span id="login-theme-icon"></span>
      </button>
    </div>
    <div class="login-header">
      <div class="login-logo" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v4H8v3h10v4H8v5H4V4z" fill="currentColor" stroke="none"/></svg>
      </div>
      <h2 style="margin: 0; font-size: 22px;">Sign In to Stall</h2>
      <p style="margin: 4px 0 0; font-size: 14px; color: var(--text-muted);">Enter credentials to unlock billing counter</p>
    </div>

    <div class="alert-banner" id="login-alert"></div>

    <!-- Password Login Form -->
    <form id="form-pwd-login">
      <div class="form-group">
        <label class="form-label" for="login-phone">Mobile Number</label>
        <input class="form-input" type="tel" id="login-phone" placeholder="10-digit mobile number" maxlength="10" required autocomplete="tel" />
      </div>
      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <div class="password-input-wrapper">
          <input class="form-input" type="password" id="login-password" placeholder="Enter password" required autocomplete="current-password" />
          <button type="button" class="btn-toggle-eye" id="btn-toggle-password" title="Show or hide password" aria-label="Toggle password visibility">
            <!-- Eye Show Icon (Masked) -->
            <svg id="icon-eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- Eye Hide Icon (Plain Text) -->
            <svg id="icon-eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>
      <button class="btn-submit-login" type="submit" id="btn-submit-pwd">Sign In to Counter</button>
    </form>

    <div class="login-footer-links">
      <p style="margin-bottom: 10px;"><a href="/register.html" style="color: var(--accent-primary); font-weight: 700;">New stall? Create account</a></p>
      <p><a href="/">&larr; Back to Portal Hub</a></p>
    </div>
  </div>

  <script src="/js/login-page.js?v=1.0.0"></script>
</body>
</html>
