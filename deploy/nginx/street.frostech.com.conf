# Nginx Configuration for FROSE Street API (api.street.frostech.com)
# Includes HTTP/2, WebSocket Upgrade, and Cloudflare Real-IP support

server {
    listen 80;
    listen [::]:80;
    server_name api.street.frostech.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.street.frostech.com;

    ssl_certificate /etc/letsencrypt/live/api.street.frostech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.street.frostech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # CORS Headers
    add_header Access-Control-Allow-Origin "https://street.frostech.com" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, Cookie, X-Requested-With" always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Reverse proxy to Fastify on port 3100
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        
        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
