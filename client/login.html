<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vendor Sign In — FROSE Street Micro-POS</title>
  <link rel="stylesheet" href="/css/style.css?v=2.3.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F8FAFC">
  <script src="/js/api-client.js?v=1.0.0"></script>
  <style>
    @media (max-width: 480px) {
      .login-container {
        margin: 16px auto !important;
        padding: 22px 18px !important;
        width: calc(100% - 24px) !important;
        border-radius: 16px !important;
      }
      .login-header { margin-bottom: 20px !important; }
      .login-logo { width: 48px !important; height: 48px !important; font-size: 22px !important; margin-bottom: 8px !important; }
    }
    .login-container {
      max-width: 440px;
      margin: 40px auto;
      padding: 28px 24px;
      background: var(--bg-surface, #FFFFFF);
      border-radius: var(--radius-xl, 20px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-light, #E2E8F0);
    }
    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0284C7 0%, #0369A1 100%);
      color: #FFF;
      font-weight: 800;
      font-size: 24px;
      margin-bottom: 12px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1.5px solid #CBD5E1;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
      transition: border-color 0.2s ease;
    }
    .form-input:focus {
      outline: none;
      border-color: #0284C7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .form-input:disabled {
      background: #F1F5F9;
      color: #94A3B8;
      cursor: not-allowed;
    }
    .password-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .password-input-wrapper .form-input {
      padding-right: 46px;
    }
    .btn-toggle-eye {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      color: #64748B;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color 0.2s ease;
    }
    .btn-toggle-eye:hover {
      color: #0F172A;
    }
    .btn-submit-login {
      width: 100%;
      height: 50px;
      background: #0284C7;
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s ease, background 0.2s ease;
    }
    .btn-submit-login:hover {
      background: #0369A1;
    }
    .btn-submit-login:disabled {
      background: #94A3B8;
      cursor: not-allowed;
      opacity: 0.7;
    }
    .login-footer-links {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #64748B;
    }
    .login-footer-links a {
      color: #64748B;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .login-footer-links a:hover {
      color: #0284C7;
    }
    .alert-banner {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 13.5px;
      line-height: 1.4;
      display: none;
    }
    .alert-banner.error {
      background: #FEF2F2;
      color: #991B1B;
      border: 1px solid #F87171;
      display: block;
    }
    .alert-banner.success {
      background: #F0FDF4;
      color: #166534;
      border: 1px solid #86EFAC;
      display: block;
    }
  </style>
</head>
<body style="background: #F8FAFC; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">⚡</div>
      <h2 style="margin: 0; font-size: 22px; color: #0F172A;">Sign In to Stall</h2>
      <p style="margin: 4px 0 0; font-size: 14px; color: #64748B;">Enter credentials to unlock billing counter</p>
    </div>

    <div class="alert-banner" id="login-alert"></div>

    <!-- Password Login Form -->
    <form id="form-pwd-login">
      <div class="form-group">
        <label class="form-label" for="login-phone">Mobile Number</label>
        <input class="form-input" type="tel" id="login-phone" placeholder="10-digit mobile number" maxlength="10" required autocomplete="tel" />
      </div>
      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <div class="password-input-wrapper">
          <input class="form-input" type="password" id="login-password" placeholder="Enter password" required autocomplete="current-password" />
          <button type="button" class="btn-toggle-eye" id="btn-toggle-password" title="Show or hide password" aria-label="Toggle password visibility">
            <!-- Eye Show Icon (Masked) -->
            <svg id="icon-eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- Eye Hide Icon (Plain Text) -->
            <svg id="icon-eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>
      <button class="btn-submit-login" type="submit" id="btn-submit-pwd">Sign In to Counter</button>
    </form>

    <div class="login-footer-links">
      <p><a href="/">← Back to Portal Hub</a></p>
    </div>
  </div>

  <script>
    (function () {
      const alertBox = document.getElementById('login-alert');
      const formPwd = document.getElementById('form-pwd-login');
      const phoneInput = document.getElementById('login-phone');
      const pwdInput = document.getElementById('login-password');
      const btnSubmit = document.getElementById('btn-submit-pwd');
      const toggleEyeBtn = document.getElementById('btn-toggle-password');
      const iconEyeShow = document.getElementById('icon-eye-show');
      const iconEyeHide = document.getElementById('icon-eye-hide');

      let countdownTimer = null;

      // 1. Password Visibility Eye Toggle
      toggleEyeBtn.addEventListener('click', () => {
        if (pwdInput.type === 'password') {
          pwdInput.type = 'text';
          iconEyeShow.style.display = 'none';
          iconEyeHide.style.display = 'block';
        } else {
          pwdInput.type = 'password';
          iconEyeShow.style.display = 'block';
          iconEyeHide.style.display = 'none';
        }
      });

      function showAlert(msg, type = 'error') {
        alertBox.textContent = msg;
        alertBox.className = 'alert-banner ' + type;
      }

      function hideAlert() {
        alertBox.className = 'alert-banner';
      }

      // 2. Progressive Lockout Countdown
      function startLockoutCountdown(seconds) {
        let remaining = seconds;
        phoneInput.disabled = true;
        pwdInput.disabled = true;
        btnSubmit.disabled = true;

        function renderCountdown() {
          const mins = Math.floor(remaining / 60);
          const secs = remaining % 60;
          const fmt = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
          showAlert('⏳ Too many failed attempts. Account locked. Try again in ' + fmt, 'error');
        }

        if (countdownTimer) clearInterval(countdownTimer);
        renderCountdown();

        countdownTimer = setInterval(() => {
          remaining--;
          if (remaining <= 0) {
            clearInterval(countdownTimer);
            phoneInput.disabled = false;
            pwdInput.disabled = false;
            btnSubmit.disabled = false;
            showAlert('🔓 Lockout expired. You may now enter your credentials.', 'success');
          } else {
            renderCountdown();
          }
        }, 1000);
      }

      // 3. Successful Authentication Dispatch
      function handleAuthSuccess(data) {
        localStorage.removeItem('frose_auth_token'); localStorage.setItem('frose_session_active', '1');
        if (data.vendor) {
          localStorage.setItem('frose_current_vendor', JSON.stringify(data.vendor));
          if (data.vendor.businessName) localStorage.setItem('frose_stall_name', data.vendor.businessName);
          if (data.vendor.phone) localStorage.setItem('frose_stall_phone', data.vendor.phone);
          if (data.vendor.upiId) localStorage.setItem('frose_vendor_vpa', data.vendor.upiId);
        }
        var isSuper = data.isSuperadmin || data.role === 'superadmin' || (data.vendor && (data.vendor.role === 'superadmin' || data.vendor.isSuperadmin));
        if (isSuper) {
          showAlert('✅ Super Admin authenticated! Opening platform console...', 'success');
          setTimeout(() => {
            window.location.href = '/admin';
          }, 500);
          return;
        }

        var isFirstLogin = !localStorage.getItem('frose_first_login_done');
        if (isFirstLogin) {
          showAlert('✅ Welcome Stall Client! Opening menu setup...', 'success');
          setTimeout(() => {
            window.location.href = '/billing?setup=1';
          }, 800);
        } else {
          showAlert('✅ Login successful! Opening dashboard...', 'success');
          setTimeout(() => {
            window.location.href = '/';
          }, 800);
        }
      }

      // 4. Submit Credentials (Server Cookie Auth Only)
      formPwd.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();
        const phone = phoneInput.value.trim().replace(/\D/g, '').slice(-10);
        const password = pwdInput.value;

        if (!phone || phone.length !== 10) {
          showAlert('Please enter a valid 10-digit mobile number');
          return;
        }

        let res = null;
        let data = null;

        try {
          const fn = window.froseApiFetch || fetch;
          res = await fn('/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-FROSE-CSRF': '1' },
            credentials: 'same-origin',
            body: JSON.stringify({ phone, password })
          });
          if (res && res.status !== 405) {
            try {
              data = await res.json();
            } catch (e) {
              data = null;
            }
          }
        } catch (netErr) {
          res = null;
          data = null;
        }

        if (res && data) {
          if (res.ok && data.status === 'success') {
            handleAuthSuccess(data);
          } else if (res.status === 429 || data.code === 'ACCOUNT_LOCKED') {
            startLockoutCountdown(data.retryAfter || 60);
          } else if (res.status === 404 || data.code === 'ACCOUNT_NOT_FOUND') {
            showAlert('❌ Account does not exist with this mobile number');
          } else {
            const msg = data.detail || data.message || 'Password incorrect. Please check and try again';
            showAlert('❌ ' + msg);
          }
          return;
        }

        showAlert('❌ Unable to reach FROSE server. Please check your connection and try again.');
      });

      // 6. Deep-Link Auto-Login & QR Pairing Support
      (function checkDeepLinkParams() {
        try {
          const params = new URLSearchParams(window.location.search);
          const stallParam = params.get('stall') || params.get('phone');
          const pwdParam = params.get('pwd') || params.get('password');
          const auto = params.get('autologin');

          if (stallParam && phoneInput) {
            phoneInput.value = stallParam.replace(/\D/g, '').slice(-10);
          }
          if (pwdParam && pwdInput) {
            pwdInput.value = pwdParam;
          }
          if (auto === '1' && phoneInput.value && pwdInput.value) {
            setTimeout(() => {
              if (formPwd) {
                formPwd.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
              }
            }, 300);
          }
        } catch (e) {}
      })();

    })();
  </script>
</body>
</html>
